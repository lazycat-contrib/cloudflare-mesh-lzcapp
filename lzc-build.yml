manifest: ./lzc-manifest.yml
pkgout: ./dist
icon: ./icon.png
contentdir: ./content

compose_override:
  services:
    cloudflare-mesh:
      cap_add:
        - NET_RAW
      devices:
        - /dev/net/tun:/dev/net/tun
      sysctls:
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"
        net.ipv6.conf.default.forwarding: "1"
