<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07100f" />
    <title>Cloudflare Mesh</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #07100f;
        --text: #f5f7f1;
        --muted: #9aa8a1;
        --line: rgba(183, 255, 213, 0.18);
        --mint: #adffd2;
        --orange: #ff7a1a;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 28px;
        background:
          radial-gradient(circle at 52% 42%, rgba(34, 112, 78, 0.18), transparent 36%),
          var(--ink);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(173, 255, 210, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(173, 255, 210, 0.035) 1px, transparent 1px);
        background-size: 46px 46px;
        content: "";
        mask-image: radial-gradient(circle at center, black, transparent 76%);
        pointer-events: none;
      }

      main {
        position: relative;
        z-index: 1;
        width: min(940px, 100%);
        text-align: center;
      }

      .mesh {
        position: relative;
        width: min(520px, 78vw);
        height: 190px;
        margin: 0 auto 26px;
      }

      .mesh svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .mesh-line {
        fill: none;
        stroke: url(#line-gradient);
        stroke-dasharray: 5 9;
        stroke-linecap: round;
        stroke-width: 1.5;
        animation: signal 7s linear infinite;
      }

      .node-halo {
        fill: rgba(173, 255, 210, 0.07);
        stroke: rgba(173, 255, 210, 0.22);
        transform-box: fill-box;
        transform-origin: center;
        animation: breathe 2.8s var(--ease-out) infinite alternate;
      }

      .node-core {
        fill: var(--mint);
        filter: drop-shadow(0 0 12px rgba(173, 255, 210, 0.55));
      }

      .node-origin .node-core {
        fill: var(--orange);
        filter: drop-shadow(0 0 16px rgba(255, 122, 26, 0.65));
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 18px;
        color: var(--mint);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--mint);
        box-shadow: 0 0 14px rgba(173, 255, 210, 0.8);
        content: "";
      }

      h1 {
        max-width: 820px;
        margin: 0 auto;
        font-size: clamp(48px, 8vw, 98px);
        font-weight: 620;
        letter-spacing: -0.065em;
        line-height: 0.9;
      }

      .accent {
        color: var(--orange);
      }

      .description {
        max-width: 660px;
        margin: 28px auto 30px;
        color: var(--muted);
        font-size: clamp(16px, 2vw, 20px);
        line-height: 1.72;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }

      .docs-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 50px;
        padding: 0 22px;
        border: 1px solid rgba(173, 255, 210, 0.22);
        border-radius: 999px;
        background: var(--mint);
        box-shadow: 0 12px 44px rgba(63, 218, 133, 0.13);
        color: #07100f;
        font-size: 14px;
        font-weight: 750;
        text-decoration: none;
        transition: transform 160ms var(--ease-out), box-shadow 180ms var(--ease-out);
      }

      .docs-link:active {
        transform: scale(0.97);
      }

      .docs-link:focus-visible {
        outline: 3px solid rgba(255, 122, 26, 0.72);
        outline-offset: 4px;
      }

      .docs-link svg {
        width: 16px;
        height: 16px;
      }

      @keyframes signal {
        to {
          stroke-dashoffset: -56;
        }
      }

      @keyframes breathe {
        to {
          opacity: 0.55;
          transform: scale(1.18);
        }
      }

      @media (hover: hover) and (pointer: fine) {
        .docs-link:hover {
          transform: translateY(-2px);
          box-shadow: 0 18px 54px rgba(63, 218, 133, 0.2);
        }
      }

      @media (max-height: 700px) {
        .mesh {
          height: 126px;
          margin-bottom: 14px;
        }

        .description {
          margin-block: 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mesh-line,
        .node-halo {
          animation: none;
        }

        .docs-link {
          transition: box-shadow 180ms ease;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mesh" aria-hidden="true">
        <svg viewBox="0 0 520 190" role="presentation">
          <defs>
            <linearGradient id="line-gradient" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#adffd2" stop-opacity="0.2" />
              <stop offset="0.5" stop-color="#adffd2" stop-opacity="0.92" />
              <stop offset="1" stop-color="#ff7a1a" stop-opacity="0.65" />
            </linearGradient>
          </defs>
          <path class="mesh-line" d="M68 122L175 52L276 105L376 42L457 118" />
          <path class="mesh-line" d="M68 122L276 105L457 118" />
          <path class="mesh-line" d="M175 52L376 42" />
          <g transform="translate(68 122)">
            <circle class="node-halo" r="16" />
            <circle class="node-core" r="4" />
          </g>
          <g transform="translate(175 52)">
            <circle class="node-halo" r="16" />
            <circle class="node-core" r="4" />
          </g>
          <g class="node-origin" transform="translate(276 105)">
            <circle class="node-halo" r="23" />
            <circle class="node-core" r="6" />
          </g>
          <g transform="translate(376 42)">
            <circle class="node-halo" r="16" />
            <circle class="node-core" r="4" />
          </g>
          <g transform="translate(457 118)">
            <circle class="node-halo" r="16" />
            <circle class="node-core" r="4" />
          </g>
        </svg>
      </div>

      <div class="eyebrow">Cloudflare One Client</div>
      <h1>Cloudflare <span class="accent">Mesh</span></h1>
      <p class="description">
        Mesh 节点是在 Linux 服务器上以无头模式运行的 Cloudflare One Client（warp-cli），用于把服务器安全地接入组织网络。
      </p>
      <div class="actions">
        <a
          class="docs-link"
          href="https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-mesh/"
          target="_blank"
          rel="noopener noreferrer"
        >
          查看官方文档
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M6 14L14 6M8 6h6v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
      </div>
    </main>
  </body>
</html>
